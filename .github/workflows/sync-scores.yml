// ── HELPERS ───────────────────────────────────────────────
function fetchUrl(url) {
  return new Promise((resolve, reject) => {
    https.get(url, res => {
      let data = '';
      res.on('data', c => data += c);
      res.on('end', () => {
        try { resolve(JSON.parse(data)); }
        catch(e) { reject(new Error('JSON inválido: ' + data.slice(0,100))); }
      });
    }).on('error', reject);
  });
}

function firestoreRequest(method, path, body) {
  const url = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents/${path}?key=${FIREBASE_API_KEY}`;
  return new Promise((resolve, reject) => {
    const parsed = new URL(url);
    const options = {
      hostname: parsed.hostname,
      path: parsed.pathname + parsed.search,
      method,
      headers: { 'Content-Type': 'application/json' },
    };
    const req = https.request(options, res => {
      let data = '';
      res.on('data', c => data += c);
      res.on('end', () => {
        try { resolve(JSON.parse(data)); }
        catch(e) { resolve({}); }
      });
    });
    req.on('error', reject);
    if (body) req.write(JSON.stringify(body));
    req.end();
  });
}

// Convierte valor JS a formato Firestore
function toFirestore(val) {
  if (val === null || val === undefined) return { nullValue: null };
  if (typeof val === 'boolean') return { booleanValue: val };
  if (typeof val === 'number') return { integerValue: String(val) };
  if (typeof val === 'string') return { stringValue: val };
  if (typeof val === 'object') {
    const fields = {};
    for (const [k, v] of Object.entries(val)) fields[k] = toFirestore(v);
    return { mapValue: { fields } };
  }
  return { stringValue: String(val) };
}

// Lee el documento de Firebase
async function getFirebaseDoc() {
  const doc = await firestoreRequest('GET', SETTINGS_PATH, null);
  const fields = doc.fields || {};
  const realResults = {};
  if (fields.realResults?.mapValue?.fields) {
    for (const [k, v] of Object.entries(fields.realResults.mapValue.fields)) {
      const f = v.mapValue?.fields || {};
      realResults[k] = {
        gl: f.gl?.stringValue ?? '',
        gv: f.gv?.stringValue ?? '',
        final: f.final?.booleanValue ?? undefined,
      };
    }
  }
  return realResults;
}

// ── MAIN ──────────────────────────────────────────────────
async function main() {
  const now   = new Date();
  const ayer  = new Date(now); ayer.setDate(now.getDate() - 1);
  const fmt   = d => d.toISOString().slice(0,10).replace(/-/g,'');

  const ESPN  = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard';

  console.log('Obteniendo partidos de ESPN…');
  const [today, yesterday] = await Promise.all([
    fetchUrl(`${ESPN}?dates=${fmt(now)}`).catch(()=>({events:[]})),
    fetchUrl(`${ESPN}?dates=${fmt(ayer)}`).catch(()=>({events:[]})),
  ]);

  const allEvents = [...(yesterday.events||[]), ...(today.events||[])];
  console.log(`ESPN: ${allEvents.length} evento(s) encontrados`);

  if (!allEvents.length) { console.log('Sin datos, saliendo.'); return; }

  // Leer estado actual de Firebase
  const currentResults = await getFirebaseDoc();
  const newResults = { ...currentResults };
  let updated = 0;

  const LIVE_ST   = ['STATUS_IN_PROGRESS','STATUS_HALFTIME'];
  const FINISH_ST = ['STATUS_FINAL'];

  for (const event of allEvents) {
    const comp    = event.competitions?.[0];
    const status  = comp?.status?.type?.name || '';
    const isLive  = LIVE_ST.includes(status);
    const isFinal = FINISH_ST.includes(status) || comp?.status?.type?.completed === true;
    if (!isLive && !isFinal) continue;

    const home = (comp?.competitors||[]).find(c=>c.homeAway==='home');
    const away = (comp?.competitors||[]).find(c=>c.homeAway==='away');
    if (!home || !away) continue;

    const homeAPI = home.team?.displayName || home.team?.name || '';
    const awayAPI = away.team?.displayName || away.team?.name || '';
    const hs = parseInt(home.score||'0'), as_ = parseInt(away.score||'0');
    if (isNaN(hs)||isNaN(as_)) continue;

    console.log(`  ${status}: ${homeAPI} ${hs}-${as_} ${awayAPI}`);

    const match = MATCHES.find(([,l,v]) => {
      const mh = TEAM_MAP[l]||l, ma = TEAM_MAP[v]||v;
      return (mh===homeAPI&&ma===awayAPI)||(mh===awayAPI&&ma===homeAPI);
    });
    if (!match) { console.log(`  ⚠️ Sin mapeo: ${homeAPI} vs ${awayAPI}`); continue; }

    const [id, local] = match;
    const mh = TEAM_MAP[local]||local;
    const gl = String(mh===homeAPI ? hs : as_);
    const gv = String(mh===homeAPI ? as_ : hs);
    const key = String(id);
    const prev = newResults[key];

    if (prev?.final === true && !isFinal) continue; // no bajar de final a en vivo
    if (!prev || prev.gl!==gl || prev.gv!==gv || prev.final!==isFinal) {
      newResults[key] = { gl, gv, final: isFinal };
      updated++;
      console.log(`  ✅ Partido ${id} actualizado: ${gl}-${gv} (final:${isFinal})`);
    }
  }

  if (updated === 0) { console.log('Sin cambios.'); }

  // Guardar siempre (para actualizar lastApiSync)
  const body = {
    fields: {
      realResults: toFirestore(newResults),
      lastApiSync: toFirestore(Date.now()),
      updatedAt:   toFirestore(Date.now()),
    }
  };
  const patchUrl = `${SETTINGS_PATH}?key=${FIREBASE_API_KEY}&updateMask.fieldPaths=realResults&updateMask.fieldPaths=lastApiSync&updateMask.fieldPaths=updatedAt`;
  await firestoreRequest('PATCH', patchUrl, body);
  console.log(`✅ Firebase actualizado (${updated} cambio(s))`);
}

main().catch(e => { console.error('Error:', e.message); process.exit(1); });

ENDSCRIPT
